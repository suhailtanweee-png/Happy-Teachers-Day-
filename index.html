<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e8eeff;color:#1c2a4e;font-family:'Inter',sans-serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;top:-100px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,#c5d8ff 0%, transparent 70%);opacity:0.6;z-index:-1;border-radius:50%}
body::after{content:"";position:fixed;bottom:-100px;right:-80px;width:500px;height:500px;background:radial-gradient(circle,#ffd6e8 0%, transparent 70%);opacity:0.5;z-index:-1;border-radius:50%}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:linear-gradient(180deg,#ffffff 0%,#e8eeff 50%, #e0e8ff 100%);position:relative;overflow:hidden}
.hero::before{content:"✨";position:absolute;top:15%;left:12%;font-size:30px;animation:float 3s infinite}
.hero::after{content:"🌸";position:absolute;top:20%;right:15%;font-size:28px;animation:float 3.5s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hero h1{font-family:'Playfair Display',serif;font-size:56px;line-height:0.9;color:#1c2a4e;cursor:pointer;text-shadow:0 4px 20px rgba(0,0,0,0.08)}
.hero h1 span{display:block;font-size:11px;letter-spacing:4px;margin-top:16px;opacity:0.6;font-family:'Inter';font-weight:700}
.btn{margin-top:28px;padding:15px 34px;border-radius:999px;background:#1c2a4e;color:#fff;border:none;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(28,42,78,0.25)}
.page{max-width:480px;margin:0 auto;padding:20px 20px 0 20px;display:none;background:transparent}
.show{display:block!important}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.card{background:rgba(255,255,255,0.9)!important;backdrop-filter:blur(10px);border-radius:22px;padding:20px;text-align:center;box-shadow:0 12px 30px rgba(28,42,78,0.08);border:1px solid rgba(255,255,255,0.8)}
.ic{width:62px;height:62px;background:linear-gradient(135deg,#e8eeff,#d6e4ff);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:28px}
.name-bar{background:linear-gradient(135deg,#a9bce8,#8fa8e0);color:#fff;padding:18px;border-radius:16px;text-align:center;font-weight:900;font-size:22px;margin-top:20px;box-shadow:0 8px 20px rgba(169,188,232,0.5)}
.article{background:#ffffff!important;border-radius:24px;padding:24px;margin-top:20px;line-height:1.85;box-shadow:0 12px 30px rgba(0,0,0,0.06);border:1px solid #e6eeff}
.lesson-card{background:#ffffff!important;border-radius:18px;padding:18px;margin:14px 0;border-left:5px solid #a9bce8;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.ph{width:100%;height:340px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.12);margin-top:18px;border:3px solid #fff}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.footer-main{margin-top:36px;background:linear-gradient(135deg,#1c2a4e,#2a3f6e)!important;border-radius:28px 28px 0 0;padding:32px 24px;text-align:center;color:#fff;box-shadow:0 -10px 40px rgba(0,0,0,0.15)}
.credit-box{margin-top:18px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);padding:14px;border-radius:14px;font-size:13px;line-height:1.5}
</style>
</head>
